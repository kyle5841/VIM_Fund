.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.top .chip{background:rgba(255,255,255,.22);color:#fff}
.top .chip .dot{width:7px;height:7px;border-radius:50%;background:#fff}
.top .asof{font-size:12px;opacity:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E130D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E130D}}
.btn.danger{color:var(--up);border-color:transparent;background:var(--up-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.top .btn{background:rgba(255,255,255,.95);border-color:transparent;color:#2C6726}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:14px 12px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
.tab.admin-tab{color:var(--brand-strong)}

main{padding:22px 0 60px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px}
.banner b{color:var(--warn)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px}
.section-title h2{font-size:17px;margin:0;letter-spacing:-.01em}
.section-title .sub{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:14px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .sub{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}

/* market strip */
.market{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mk{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.mk .n{font-size:12px;color:var(--muted);font-weight:600}
.mk .v{font-size:18px;font-weight:700;margin-top:2px}
.mk .c{font-size:12px;font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;margin-top:14px}
.nav-card{background:linear-gradient(135deg,var(--brand-soft),var(--surface) 70%);border:1px solid var(--brand-line)}
.nav-card .lbl{font-size:13px;color:var(--text-2);font-weight:600}
.nav-card .big{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.nav-card .delta{font-size:15px;font-weight:700}
.nav-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--brand-line)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.kpi .v{font-size:18px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:12px;margin-top:2px}
.meta .l{font-size:12px;color:var(--muted)}
.meta .v{font-size:15px;font-weight:700}

/* chart */
.chart-box{position:relative;height:280px}
.chart-box.sm{height:220px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:-4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend b{color:var(--text);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}

/* bullets (sector) */
.bullets{display:flex;flex-direction:column;gap:12px}
.bl{display:grid;grid-template-columns:72px minmax(0,1fr) 92px;align-items:center;gap:10px;font-size:13px}
.bl .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .track{position:relative;height:14px;background:var(--grid);border-radius:4px}
.bl .bar{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:0 4px 4px 0}
.bl .bar.over{background:var(--brand-strong)}
.bl .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--target);border-radius:1px}
.bl .val{text-align:right;font-weight:700}
.bl .val small{color:var(--muted);font-weight:500}
.bl-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.bl-legend i{display:inline-block;vertical-align:middle;margin-right:5px}

/* rank lists */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13px}
.rank li:last-child{border-bottom:0}
.rank .i{width:20px;height:20px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;flex:none}
.rank .nm{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .v{font-weight:700}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arr{font-size:10px;margin-left:3px}
td.r,th.r{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
.code{font-size:11px;color:var(--muted);margin-left:6px}
.wbar{display:inline-block;height:6px;border-radius:0 3px 3px 0;background:var(--brand);vertical-align:middle;margin-right:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge.buy{background:var(--up-soft);color:var(--up)}
.badge.sell{background:var(--down-soft);color:var(--down)}
.badge.sector{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.badge.kis{background:var(--grid);color:var(--text-2);font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.meet{background:var(--brand-soft);color:var(--brand-ink);box-shadow:inset 0 0 0 1px var(--brand-line)}
.meet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 0 8px;font-weight:700}
.meet-head .sub{font-size:12px;color:var(--muted);font-weight:500}
.check{flex-direction:row!important;align-items:center;gap:8px!important;font-size:13px!important;color:var(--text)!important}
.roles{display:flex;flex-direction:column;gap:10px;font-size:13px}
.roles .r{display:grid;grid-template-columns:64px 1fr;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--grid)}
.roles .r:last-child{border:0;padding-bottom:0}
.roles b{font-weight:700}
.top .chip.role{background:rgba(0,0,0,.18)}
td.reason{white-space:normal;min-width:240px;max-width:420px;color:var(--text-2);font-size:12.5px}
td.reason .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;white-space:pre-line}
td.reason .clamp.open{-webkit-line-clamp:unset}
.none{color:var(--muted);font-style:italic}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.input,select.input,textarea.input{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0}
.input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--border);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer}
.pill.on{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}

/* risk table */
.risk td,.risk th{padding:12px 14px}
.risk td.v{font-weight:700;text-align:right}
.hint{font-size:12px;color:var(--muted);margin-top:10px}

/* admin */
.form{display:grid;gap:12px}
.form .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--text-2)}
.form .help{font-weight:400;color:var(--muted);font-size:11.5px}
.status{display:flex;flex-direction:column;gap:8px;font-size:13px}
.status .line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--grid);padding-bottom:8px}
.status .line:last-child{border:0}
.ok{color:var(--brand-strong);font-weight:700}
.bad{color:var(--up);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.result{margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap}
.warnlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.warnlist li{background:var(--warn-soft);border-radius:10px;padding:9px 12px;font-size:12.5px}
.warnlist li b{color:var(--warn)}
.tgt-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:8px;align-items:center}
.logbox{max-height:280px;overflow:auto;font-size:12px}
.logbox div{padding:6px 0;border-bottom:1px solid var(--grid);display:grid;grid-template-columns:120px 56px 1fr;gap:8px}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,10,.45)}
dialog .hd{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
dialog .hd h3{margin:0;font-size:16px}
dialog .bd{padding:16px 20px}
dialog .ft{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--up);font-size:12.5px;min-height:1em}
.pw-wrap{position:relative;display:block}
.pw-wrap .input{width:100%;padding-right:42px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:6px;display:flex;align-items:center}
.pw-eye:hover{color:var(--text);background:var(--grid)}
.pw-eye:focus-visible{outline:2px solid var(--brand)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d261b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.toast.err{background:#8a1f1c}
footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 0 40px}

@media (max-width: 960px){

}
@media (max-width: 640px){

}

  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (_) {} },
};
function toast(msg, isErr) {

}

const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const sd = a => { if (a.length < 2) return NaN; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };

/* ===================== API ===================== */
/* 여러 번 보내도 결과가 같은 요청만 자동 재시도 (매매 입력·수정·삭제 등은 제외) */
const SAFE_RETRY = ['public', 'companies', 'data', 'info', 'login', 'testKis', 'syncNow', 'reconcile'];

/** 응답을 JSON으로 읽고, Google이 HTML 오류 페이지를 보내면 그 제목·내용을 담은 오류로 바꿉니다. */
async function readJson(r) {
  const text = await r.text();
  try { return JSON.parse(text); } catch (_) {}
  const title = ((text.match(/<title>([^<]*)<\/title>/i) || [])[1] || '').trim();
  const body = text.replace(/<(style|script)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
  const err = new Error(`서버가 데이터 대신 오류 페이지를 보냈습니다 (HTTP ${r.status}${title ? ' · ' + title : ''})${body ? ' — ' + body : ''}`);
  err.nonJson = true;
  return Promise.reject(err);
}
async function withRetry(action, send) {
  try { return await send(); }
  catch (e) {
    if (!e.nonJson || !SAFE_RETRY.includes(action)) throw e;
    await new Promise(r => setTimeout(r, 1500));
    return send();
  }
}
async function apiGet(action) {
  const j = await withRetry(action, async () => readJson(await fetch(CONFIG.API_URL + (CONFIG.API_URL.includes('?') ? '&' : '?') + 'action=' + action, { cache: 'no-store' })));
  if (!j.ok) throw new Error(j.error || '요청 실패');
  return j;
}
async function apiPost(action, payload = {}) {
  if (isDemo()) return demoPost(action, payload);
  const j = await withRetry(action, async () => readJson(await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token: S.auth && S.auth.token }, payload)),
  })));
  if (!j.ok) {
    if (j.error === 'AUTH') { setAuth(null, false); throw new Error('로그인이 만료되었습니다. 다시 로그인하세요.'); }
    throw new Error(j.error || '요청 실패');
  }
  return j;
}

/* 데모 모드: 변경사항은 이 브라우저 메모리에만 반영 */
function demoPost(action, p) {
  const raw = S.demoFull;
  const kisOnly = () => { throw new Error('데모 모드입니다. Apps Script를 배포하고 CONFIG.API_URL을 설정하면 사용할 수 있습니다.'); };
  if (!['login', 'logout'].includes(action) && !isAdmin()) throw new Error('관리자만 사용할 수 있는 기능입니다.'); // 서버와 같은 권한 규칙
  const findRow = row => { const i = raw.trades.findIndex(x => x[7] === row); if (i < 0) throw new Error('행을 찾을 수 없습니다.'); return i; };
  switch (action) {
    case 'login': return { ok: true, role: p.role === 'admin' ? 'admin' : 'member', token: 'demo-' + p.role };
    case 'info': return { ok: true, info: { kis: { enabled: false }, autoSync: false, dailyRecord: false, weeklyBackup: false, lastSync: null, sheetLock: null, backups: [], log: [] } };
    case 'addTrade': {
      const t = normTradeInput(p.trade);
      const row = Math.max(1, ...raw.trades.map(x => x[7])) + 1;
      raw.trades.push([t.date, t.code, t.name, t.price, t.qty, t.sector, t.reason, row, 'WEB', t.meeting || '']);
      return { ok: true };
    }
    case 'updateTrade': {
      const i = findRow(p.row);
      const t = normTradeInput(p.trade);
      raw.trades[i] = [t.date, t.code, t.name, t.price, t.qty, t.sector, t.reason, p.row, raw.trades[i][8], t.meeting !== undefined ? t.meeting : (raw.trades[i][9] || '')];
      return { ok: true };
    }
    case 'setMeeting': raw.trades[findRow(p.row)][9] = p.meeting || ''; return { ok: true };
    case 'deleteTrade': raw.trades = raw.trades.filter(x => x[7] !== p.row); return { ok: true };
    case 'saveTargets': raw.targets = p.targets; return { ok: true };
    case 'saveConfig': Object.assign(raw.config, p.config); return { ok: true };
    case 'logout': return { ok: true };
    default: return kisOnly();
  }
}
function normTradeInput(t) {
  if (!t.date) throw new Error('거래일을 입력하세요.');
  if (!t.name) throw new Error('종목명을 입력하세요.');
  if (!/^[0-9A-Z]{6}$/.test(t.code || '')) throw new Error('종목코드(6자리)를 확인하세요.');
  if (!(t.price > 0)) throw new Error('단가가 올바르지 않습니다.');
  if (!t.qty) throw new Error('수량이 올바르지 않습니다.');
  return t;
}

/* ===================== 계산 엔진 =====================
 * 스프레드시트 수식을 그대로 옮기되, 종목코드 기준으로 묶고 이동평균법으로 평균단가를 계산합니다.
 *  - 매수: 평균단가 = (기존수량×기존단가 + 매수수량×매수단가) / 새 수량
 *  - 매도: 평균단가 유지, 실현손익 = 매도수량 × (매도가 − 평균단가)
 *  - 보유수량을 초과한 매도는 손익에서 제외하고 경고로 표시                         */
function parseTrades(rows) {
  return (rows || []).map(t => ({
    date: t[0], code: String(t[1] || ''), name: t[2], price: +t[3], qty: +t[4],
    sector: t[5] || '미분류', reason: t[6] || '', row: t[7], src: t[8] || '', meeting: t[9] || '',
  })).filter(t => t.name);
}
const sortTrades = trades => [...trades].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.row - b.row);

/** 매매기록 → 종목별 포지션(수량·평균단가)과 실현손익 */
function runLedger(sorted, warnings) {
  const pos = {};
  const realized = [];
  for (const t of sorted) {
    if (!t.code) { warnings.push({ k: '종목코드 없음', m: `${t.date} ${t.name} — 기업목록_DB에서 종목코드를 찾지 못해 계산에서 제외했습니다.` }); continue; }
    const p = pos[t.code] || (pos[t.code] = { code: t.code, qty: 0, avg: 0 });
    p.name = t.name; p.sector = t.sector;
    if (t.qty > 0) {
      const nq = p.qty + t.qty;
      p.avg = (p.qty * p.avg + t.qty * t.price) / nq;
      p.qty = Math.round(nq * 1e6) / 1e6;
    } else if (t.qty < 0) {
      let q = -t.qty;
      if (q > p.qty + 1e-9) {
        warnings.push({ k: '보유수량 초과 매도', m: `${t.date} ${t.name} ${qtyf(q)}주 매도 — 기록상 보유 ${qtyf(p.qty)}주. 매수 기록 ${qtyf(q - p.qty)}주가 누락된 것으로 보여 초과분(${won((q - p.qty) * t.price)})은 손익에서 제외했습니다.` });
        q = p.qty;
      }
      if (q > 0) realized.push({ date: t.date, code: t.code, name: t.name, sector: t.sector, qty: q, buy: p.avg, sell: t.price, buyAmt: q * p.avg, sellAmt: q * t.price, pnl: q * (t.price - p.avg), pct: p.avg ? t.price / p.avg - 1 : 0, reason: t.reason });
      p.qty = Math.round((p.qty - q) * 1e6) / 1e6;
      if (p.qty <= 0) { p.qty = 0; p.avg = 0; }
    }
  }
  return { pos, realized };
}

/** 방문자용 데이터 = 서버의 buildPublic_과 같은 형태 (데모 모드에서 사용) */
function toPublic(full) {
  const { pos, realized } = runLedger(sortTrades(parseTrades(full.trades)), []);
  const held = Object.values(pos).filter(p => p.qty > 0);
  const out = JSON.parse(JSON.stringify(full));
  delete out.trades;
  out.positions = held.map(p => [p.code, p.name, p.sector, p.qty, p.avg]);
  if (!ok(out.cash)) out.cash = full.config.seed - held.reduce((s, p) => s + p.qty * p.avg, 0) + realized.reduce((s, r) => s + r.pnl, 0);
  out.access = 'public';
  return out;
}

function compute(raw) {
  const cfg = raw.config;
  const seed = cfg.seed;
  const warnings = [];
  const full = Array.isArray(raw.trades); // 부원 이상: 매매기록 포함
  let trades = [], sorted = [], realized = [], pos = {};
  if (full) {
    trades = parseTrades(raw.trades);
    sorted = sortTrades(trades);
    ({ pos, realized } = runLedger(sorted, warnings));
  } else {
    (raw.positions || []).forEach(p => { pos[p[0]] = { code: p[0], name: p[1], sector: p[2] || '미분류', qty: +p[3], avg: +p[4] }; });
  }

  const prices = raw.prices || {};
  const holdings = Object.values(pos).filter(p => p.qty > 0).map(p => {
    const pr = prices[p.code];
    const price = pr && pr[0] > 0 ? +pr[0] : null;
    if (!price) warnings.push({ k: '시세 없음', m: `${p.name}(${p.code}) 현재가를 가져오지 못해 평균단가로 평가했습니다.` });
    const cur = price || p.avg;
    const cost = p.qty * p.avg, value = p.qty * cur;
    return { ...p, price: cur, stale: !price, cost, value, pnl: value - cost, ret: cost ? value / cost - 1 : 0 };
  });
  const evalSum = holdings.reduce((s, h) => s + h.value, 0);
  holdings.forEach(h => { h.weight = evalSum ? h.value / evalSum : 0; });

  const cost = holdings.reduce((s, h) => s + h.cost, 0);
  const realizedSum = realized.reduce((s, r) => s + r.pnl, 0);
  const cash = ok(raw.cash) ? +raw.cash : seed - cost + realizedSum;
  const aum = evalSum + cash;
  const wins = realized.filter(r => r.pnl > 0), losses = realized.filter(r => r.pnl < 0);
  const fund = {
    seed, cost, eval: evalSum, cash, aum, nav: aum / seed * 1000, cumRet: aum / seed - 1,
    unreal: evalSum - cost, unrealPct: cost ? evalSum / cost - 1 : 0, realized: full ? realizedSum : null,
    wins: wins.length, losses: losses.length,
    winRate: wins.length + losses.length ? wins.length / (wins.length + losses.length) : null,
    avgWin: wins.length ? mean(wins.map(r => r.pnl)) : null,
    avgLoss: losses.length ? mean(losses.map(r => r.pnl)) : null,
  };
  fund.pf = fund.avgWin != null && fund.avgLoss ? fund.avgWin / -fund.avgLoss : null;

  // 섹터 (보유섹터 현황 시트와 동일한 열)
  const targets = (raw.targets || []).map(t => ({ name: t[0], target: t[1] == null || t[1] === '' ? null : +t[1] }));
  const names = targets.map(t => t.name);
  holdings.forEach(h => { if (!names.includes(h.sector)) { names.push(h.sector); targets.push({ name: h.sector, target: null }); } });
  if (!names.includes('현금')) targets.push({ name: '현금', target: null });
  const sectors = targets.map(t => {
    const hs = holdings.filter(h => h.sector === t.name);
    const isCash = t.name === '현금';
    const value = isCash ? cash : hs.reduce((s, h) => s + h.value, 0);
    const c = isCash ? cash : hs.reduce((s, h) => s + h.cost, 0);
    const w = aum ? value / aum : 0;
    const tgtAmt = t.target != null ? t.target * aum : null;
    return { name: t.name, target: t.target, weight: w, diff: t.target != null ? w - t.target : null, cost: c, tgtAmt, value, room: tgtAmt != null ? tgtAmt - value : null, ret: !isCash && c ? value / c - 1 : null, count: hs.length, isCash };
  });
  const tsum = targets.reduce((s, t) => s + (t.target || 0), 0);
  if (targets.some(t => t.target != null) && Math.abs(tsum - 1) > 0.0005) warnings.push({ k: '목표비중 합계', m: `섹터 목표비중 합계가 ${pct(tsum, 1, false)}입니다 (100%가 아님).` });
  if (holdings.some(h => h.sector === '미분류')) warnings.push({ k: '섹터 미분류', m: `섹터가 '미분류'인 보유종목이 있습니다: ${holdings.filter(h => h.sector === '미분류').map(h => h.name).join(', ')}` });

  const hist = buildHistory(raw, fund, cfg, warnings);
  return { cfg, full, trades, sorted, holdings, realized, fund, sectors, hist, warnings };
}

function buildHistory(raw, fund, cfg, warnings) {
  const seed = cfg.seed;
  const map = new Map();
  const bad = [];
  for (const r of raw.history || []) {
    const [d, k, a] = r;
    if (!d) continue;
    if (!(k > 0) || !(a > seed * 0.05)) { bad.push(d); continue; }
    map.set(d, { date: d, kospi: +k, aum: +a });
  }
  if (bad.length) warnings.push({ k: '수익률_DB 오류 행', m: `${bad.join(', ')} 기록의 AUM/KOSPI 값이 비정상이라 제외했습니다. 관리자 → 수익률 이력 재구성으로 복구할 수 있습니다.` });
  const today = kstDate(raw.asOf);
  const dow = new Date(today + 'T12:00:00+09:00').getUTCDay();
  const km = (raw.market || []).find(x => /KOSPI/i.test(x.name));
  const keys = [...map.keys()].sort();
  if (km && km.price > 0 && dow >= 1 && dow <= 5 && (!keys.length || keys[keys.length - 1] < today)) {
    map.set(today, { date: today, kospi: km.price, aum: fund.aum, live: true });
  }
  const rows = [...map.values()].sort((a, b) => a.date < b.date ? -1 : 1);
  if (!rows.length) return { rows, stats: null };
  const k0 = rows[0].kospi;
  let pf = 100, pk = 0;
  rows.forEach((r, i) => {
    r.kIdx = r.kospi / k0 * 100;
    r.fIdx = r.aum / seed * 100;
    if (i) { r.kRet = r.kospi / rows[i - 1].kospi - 1; r.fRet = r.aum / rows[i - 1].aum - 1; r.ex = r.fRet - r.kRet; }
    pf = Math.max(pf, r.fIdx); pk = Math.max(pk, r.kIdx);
    r.fDD = r.fIdx / pf - 1; r.kDD = r.kIdx / pk - 1;
  });
  const D = cfg.days || 252, rf = cfg.rf || 0;
  const f = rows.slice(1).map(r => r.fRet), k = rows.slice(1).map(r => r.kRet), e = rows.slice(1).map(r => r.ex);
  const last = rows[rows.length - 1];
  const side = (arr, dd, period) => {
    const ann = arr.length ? mean(arr) * D : NaN, vol = sd(arr) * Math.sqrt(D);
    return { ann, vol, sharpe: vol ? (ann - rf) / vol : NaN, mdd: Math.min(...dd), period };
  };
  let beta = NaN;
  if (f.length > 1) {
    const mf = mean(f), mk = mean(k);
    const cov = f.reduce((s, x, i) => s + (x - mf) * (k[i] - mk), 0) / (f.length - 1);
    beta = cov / (sd(k) ** 2);
  }
  const stats = {
    n: f.length,
    fund: side(f, rows.map(r => r.fDD), last.fIdx / 100 - 1),
    kospi: side(k, rows.map(r => r.kDD), last.kIdx / 100 - 1),
    ir: e.length > 1 ? mean(e) * D / (sd(e) * Math.sqrt(D)) : NaN,
    beta,
  };
  return { rows, stats };
}

/* ===================== 로딩 ===================== */
async function load(silent) {
  try {
    let raw;
    if (isDemo()) {
      if (!S.demoFull) S.demoFull = JSON.parse(JSON.stringify(DEMO));
      raw = can('member') ? JSON.parse(JSON.stringify(S.demoFull)) : toPublic(S.demoFull);
    } else if (can('member')) {
      try { raw = (await apiPost('data')).data; }
      catch (e) {
        if (S.auth) throw e;
        raw = await apiGet('public'); // 로그인 만료 → 방문자 화면으로
        toast('로그인이 만료되어 방문자 화면으로 전환했습니다.', true);
      }
    } else {
      raw = await apiGet('public');
    }
    S.raw = raw;
    S.tab = validTab(S.tab);
    S.m = compute(raw);
    renderHeader();
    render();
  } catch (e) {
    if (!silent) $('#view').innerHTML = `<div class="card empty">데이터를 불러오지 못했습니다.<br><span class="muted">${esc(e.message)}</span></div>`;
    else toast('새로고침 실패: ' + e.message, true);
  }
}

function renderHeader() {
  const raw = S.raw;
  const src = isDemo() ? '데모 데이터' : raw.source === 'kis' ? '한국투자증권 연동' : '스프레드시트 연동';
  $('#srcChip').innerHTML = `<span class="dot"></span><span>${esc(src)}</span>`;
  $('#asOf').textContent = '기준 ' + kstTime(raw.asOf) + (raw.lastSync ? ' · 동기화 ' + kstTime(raw.lastSync) : '');
  $('#adminBtn').textContent = S.auth ? '로그아웃' : '로그인';
  const rc = $('#roleChip');
  rc.hidden = !S.auth;
  rc.textContent = ROLE_NAME[role()];
  $('#tabs').innerHTML = TABS.filter(t => can(t[2])).map(([k, l]) => `<button class="tab ${k === 'admin' ? 'admin-tab' : ''} ${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('');
}

function validTab(h) { const t = TABS.find(x => x[0] === h); return t && can(t[2]) ? h : 'dashboard'; }
function go(tab, keepScroll) {
  S.tab = validTab(tab);
  try { if (location.hash !== '#' + S.tab) history.pushState(null, '', '#' + S.tab); } catch (_) {}
  if (S.m) { renderHeader(); render(); }
  if (!keepScroll) window.scrollTo(0, 0);
}
function route() { go(location.hash.replace('#', '') || 'dashboard', true); }

function render() {
  Object.values(S.charts).forEach(c => c && c.destroy());
  S.charts = {};
  const v = $('#view');
  const demoBanner = isDemo() ? `<div class="banner"><span>ℹ️</span><div><b>데모 모드</b> — 스프레드시트 스냅샷(2026-09-23) 데이터로 표시 중입니다. Apps Script를 배포하고 <code>CONFIG.API_URL</code>을 설정하면 시트·한국투자증권 계좌와 실시간 연동됩니다.</div></div>` : '';
  const fn = { dashboard: viewDashboard, holdings: viewHoldings, sectors: viewSectors, trades: viewTrades, realized: viewRealized, risk: viewRisk, admin: viewAdmin }[S.tab];
  v.innerHTML = demoBanner + fn();
  const after = { dashboard: afterDashboard, holdings: null, sectors: null, trades: null, realized: afterRealized, risk: afterRisk, admin: afterAdmin }[S.tab];
  if (after) after();
}

/* ===================== 차트 ===================== */
const crosshair = {
  id: 'crosshair',
  afterDraw(chart) {
    const act = chart.tooltip && chart.tooltip.getActiveElements();
    if (!act || !act.length) return;
    const x = act[0].element.x, { top, bottom } = chart.chartArea, ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = css('--border'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore();
  },
};
function baseOpts(yFmt) {
  const grid = css('--grid'), muted = css('--muted');
  return {
    responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: css('--surface'), titleColor: css('--text'), bodyColor: css('--text-2'),
        borderColor: css('--border'), borderWidth: 1, padding: 10, boxPadding: 4, usePointStyle: true,
        titleFont: { weight: '700' }, bodyFont: { family: 'Pretendard Variable, sans-serif' },
      },
    },
    scales: {
      x: { grid: { display: false }, ticks: { color: muted, maxRotation: 0, autoSkipPadding: 14, font: { size: 11 } }, border: { color: grid } },
      y: { grid: { color: grid }, ticks: { color: muted, font: { size: 11 }, callback: yFmt }, border: { display: false } },
    },
  };
}
function lineDs(label, data, color, opts = {}) {
  return Object.assign({ label, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0.15 }, opts);
}
function mkChart(id, cfg) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!window.Chart) { el.parentElement.innerHTML = '<div class="empty">차트 라이브러리를 불러오지 못했습니다.</div>'; return; }
  cfg.plugins = (cfg.plugins || []).concat(crosshair);
  S.charts[id] = new Chart(el, cfg);
}
function navChart(id) {
  const rows = S.m.hist.rows;
  if (rows.length < 2) return;
  const o = baseOpts(v => v.toFixed(0));
  o.plugins.tooltip.callbacks = {
    title: it => rows[it[0].dataIndex].date + (rows[it[0].dataIndex].live ? ' (실시간)' : ''),
    label: c => ` ${c.dataset.label}  ${c.parsed.y.toFixed(2)}`,
    afterBody: it => { const r = rows[it[0].dataIndex]; return [`AUM ${won(r.aum)}`, `KOSPI ${dec2(r.kospi)}`]; },
  };
  mkChart(id, {
    type: 'line',
    data: { labels: rows.map(r => md(r.date)), datasets: [
      lineDs('VIM 펀드', rows.map(r => r.fIdx), css('--fund'), { fill: { target: { value: 100 }, above: hexA(css('--fund'), .10), below: hexA(css('--fund'), .04) } }),
      lineDs('KOSPI', rows.map(r => r.kIdx), css('--bench'), { borderDash: [5, 4] }),
    ] },
    options: o,
  });
}
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function navLegend() {
  const rows = S.m.hist.rows;
  if (!rows.length) return '';
  const l = rows[rows.length - 1];
  return `<div class="legend"><span><i style="background:var(--fund)"></i>VIM 펀드 <b class="num">${dec2(l.fIdx)}</b></span><span><i style="background:repeating-linear-gradient(90deg,var(--bench) 0 5px,transparent 5px 8px)"></i>KOSPI <b class="num">${dec2(l.kIdx)}</b></span><span class="muted">기준 100 · 펀드=AUM÷설정액, KOSPI=${esc(rows[0].date)} 종가</span></div>`;
}

function kpi(l, v, s) { return `<div class="kpi"><div class="l">${l}</div><div class="v num">${v}</div><div class="s muted">${s || ''}</div></div>`; }

function bullets(compact) {

    <tfoot><tr><td colspan="5">합계</td><td class="r num">${int(tot.cost)}</td><td class="r num">${int(tot.value)}</td><td class="r num ${cls(tot.value - tot.cost)}">${signed(tot.value - tot.cost, int)}</td><td class="r num ${cls(tot.value - tot.cost)}">${pct(tot.cost ? tot.value / tot.cost - 1 : 0)}</td><td></td></tr></tfoot>

      ${admin ? `<td><button class="btn sm" data-meet="${t.row}" title="주간 회의 결정 표시">📌${t.meeting ? ' ✓' : ''}</button> <button class="btn sm" data-edit="${t.row}">수정</button> <button class="btn sm danger" data-del="${t.row}">삭제</button></td>` : ''}

function viewTrades() {
  const st = S.tr;
  const all = [...S.m.sorted].reverse();
  const secs = [...new Set(all.map(t => t.sector))];
  const q = st.q.trim().toLowerCase();
  const list = all.filter(t =>
    (st.side === 'all' || (st.side === 'buy' ? t.qty > 0 : t.qty < 0)) &&
    (st.sector === 'all' || t.sector === st.sector) &&
    (!st.missing || !t.reason) &&
    (!st.meeting || t.meeting) &&
    (!q || t.name.toLowerCase().includes(q) || t.code.includes(q) || t.reason.toLowerCase().includes(q)));
  const buys = all.filter(t => t.qty > 0), sells = all.filter(t => t.qty < 0);
  const missing = all.filter(t => !t.reason).length;
  const meetCount = all.filter(t => t.meeting).length;
  return `
  <div class="section-title" style="margin-top:0"><h2>매매기록</h2><span class="sub">총 ${all.length}건 · 매수 ${buys.length} · 매도 ${sells.length}</span></div>
  <div class="toolbar">

  <p class="hint">매수는 수량 양수, 매도는 수량 음수로 시트에 기록됩니다. 매매근거를 누르면 전체 내용을 볼 수 있습니다. 📌 표시는 주간 회의에서 결정된 매매입니다${isAdmin() ? ' (각 행의 📌 버튼으로 표시·해제)' : ''}.</p>`;
}
/** 주간회의 결정 매매만 회의일별로 묶어서 보기 */
function meetingGroups(list) {
  if (!list.length) return `<div class="card empty">주간 회의 결정으로 표시된 매매가 없습니다.${isAdmin() ? '<br>매매기록 각 행의 📌 버튼으로 표시할 수 있습니다.' : ''}</div>`;
  const groups = new Map();
  [...list].sort((a, b) => (a.meeting < b.meeting ? 1 : a.meeting > b.meeting ? -1 : 0)).forEach(t => {
    if (!groups.has(t.meeting)) groups.set(t.meeting, []);
    groups.get(t.meeting).push(t);
  });
  return [...groups.entries()].map(([d, items]) => {
    const buys = items.filter(t => t.qty > 0), sells = items.filter(t => t.qty < 0);
    const amt = arr => arr.reduce((s, t) => s + Math.abs(t.qty) * t.price, 0);
    const part = (l, arr) => arr.length ? `${l} ${arr.length}건 ${eok(amt(arr))}원` : '';
    return `<div class="meet-head"><span>📌 ${esc(d)} 주간회의</span><span class="sub">${[part('매수', buys), part('매도', sells)].filter(Boolean).join(' · ')}</span></div>${tradeTable(items, true)}`;
  }).join('');
}

function afterRealized() {
  const rs = [...S.m.realized].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (!rs.length) return;
  const byDate = [];
  let acc = 0;
  rs.forEach(r => {
    acc += r.pnl;
    const last = byDate[byDate.length - 1];
    if (last && last.date === r.date) { last.v = acc; last.items.push(r); } else byDate.push({ date: r.date, v: acc, items: [r] });
  });
  const o = baseOpts(v => eok(v));
  o.plugins.tooltip.callbacks = {
    title: it => byDate[it[0].dataIndex].date,
    label: c => ` 누적 ${signed(c.parsed.y)}`,
    afterBody: it => byDate[it[0].dataIndex].items.map(r => `${r.name} ${signed(r.pnl)}`),
  };
  const color = css('--brand-strong');
  mkChart('cReal', { type: 'line', data: { labels: byDate.map(d => md(d.date)), datasets: [
    lineDs('누적 실현손익', byDate.map(d => d.v), color, { stepped: 'before', fill: { target: 'origin', above: hexA(color, .10), below: hexA(css('--down'), .08) }, pointRadius: 3, pointBackgroundColor: color, tension: 0 }),
  ] }, options: o });
}

function exportCsv(kind) {
  const m = S.m;
  const n2 = v => ok(v) ? Math.round(v * 100) / 100 : '';
  const sets = {
    trades: ['매매기록', ['거래일', '종목코드', '종목명', '단가', '수량(+매수/-매도)', '섹터', '매매근거', '출처', '주간회의'],
      m.sorted.map(t => [t.date, t.code, t.name, t.price, t.qty, t.sector, t.reason, t.src, t.meeting])],
    holdings: ['보유종목', ['종목코드', '종목명', '섹터', '수량', '평균단가', '현재가', '매입금액', '평가금액', '평가손익', '수익률', '보유비중'],
      m.holdings.map(h => [h.code, h.name, h.sector, h.qty, n2(h.avg), h.price, Math.round(h.cost), Math.round(h.value), Math.round(h.pnl), h.ret, h.weight])],
    realized: ['실현손익', ['일자', '종목코드', '종목명', '수량', '매입가', '매도가', '매입액', '매도액', '실현손익', '손익률'],
      m.realized.map(r => [r.date, r.code, r.name, r.qty, n2(r.buy), r.sell, Math.round(r.buyAmt), Math.round(r.sellAmt), Math.round(r.pnl), r.pct])],
    history: ['일별수익률', ['일자', 'KOSPI', 'KOSPI지수', 'KOSPI일간', 'AUM', '펀드지수', '펀드일간', '초과수익', '펀드낙폭', 'KOSPI낙폭'],
      m.hist.rows.map(r => [r.date, r.kospi, n2(r.kIdx), r.kRet, Math.round(r.aum), n2(r.fIdx), r.fRet, r.ex, r.fDD, r.kDD])],
  };
  const [name, head, rows] = sets[kind];
  const cell = v => {
    if (v == null || (typeof v === 'number' && !isFinite(v))) return '';
    let s = String(v);
    if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s; // 엑셀 수식 실행 방지
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const text = '﻿' + [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = `VIM_${name}_${kstDate()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${name} CSV를 내려받았습니다.`);
}

        j = await apiPost('setup', { code: f.get('code'), password: f.get('pw') });
      } else {
        j = await withRetry('login', async () => readJson(await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', password: f.get('pw') }) })));
        if (j.error === 'NEED_SETUP') { openLogin(true); return; }
        if (!j.ok) throw new Error(j.error);
      }
      setAuth({ token: j.token, role: j.role === 'admin' ? 'admin' : 'member' }, false);
      dlg.close();
      await load(true);
      toast(ROLE_NAME[role()] + '(으)로 로그인했습니다.');
      go(isAdmin() ? 'admin' : 'trades');
    } catch (x) { err.textContent = x.message; }
  };
}
/** 로그인 상태 변경. reload=true면 권한에 맞는 데이터를 다시 받아옵니다. */
function setAuth(a, reload = true) {
  S.auth = a; S.info = null; S.recon = null; S.flash = {};
  store.set('vim_auth', a ? JSON.stringify(a) : null);
  S.tab = validTab(S.tab);
  if (reload) load(true);
  else if (S.m) renderHeader();
}

async function openTrade(row) {
  const t = row ? S.m.trades.find(x => x.row === row) : null;
  const sectors = [...new Set((S.raw.targets || []).map(x => x[0]).filter(s => s !== '현금').concat(S.m.trades.map(x => x.sector)))];
  if (!S.corp && !isDemo()) apiGet('companies').then(j => { S.corp = j.companies; fillCorp(); }).catch(() => {});
  dlg.innerHTML = `<form method="dialog" id="trForm">
    <div class="hd"><h3>${t ? '매매기록 수정' : '매매 입력'}</h3><button type="button" class="btn ghost sm" data-close aria-label="닫기">✕</button></div>
    <div class="bd form">
      <div class="row">
        <label>거래일<input class="input" type="date" name="date" required value="${esc(t ? t.date : kstDate())}"></label>
        <label>구분<div class="seg" id="sideSeg"><button type="button" data-v="1" class="${!t || t.qty > 0 ? 'on' : ''}">매수</button><button type="button" data-v="-1" class="${t && t.qty < 0 ? 'on' : ''}">매도</button></div></label>
      </div>
      <div class="row">
        <label>종목명<input class="input" name="name" list="corpList" required value="${esc(t ? t.name : '')}" placeholder="예: 삼성전자"><span class="help">기업목록_DB의 이름과 정확히 같아야 합니다 (예: SM → 에스엠)</span></label>
        <label>종목코드<input class="input" name="code" required maxlength="6" value="${esc(t ? t.code : '')}" placeholder="005930"></label>
      </div>
      <div class="row">
        <label>단가 (원)<input class="input num" name="price" inputmode="decimal" required value="${t ? t.price : ''}"></label>
        <label>수량 (주)<input class="input num" name="qty" inputmode="decimal" required value="${t ? Math.abs(t.qty) : ''}"></label>
      </div>
      <label>섹터<input class="input" name="sector" list="secList" value="${esc(t ? t.sector : '')}" placeholder="예: 반도체"></label>
      <label>매매근거 / 투자전략<textarea class="input" name="reason" rows="4">${esc(t ? t.reason : '')}</textarea></label>
      <div class="row">
        <label class="check"><input type="checkbox" name="isMeeting" ${t && t.meeting ? 'checked' : ''}> 📌 주간 회의에서 결정된 매매</label>
        <label>회의일<input class="input" type="date" name="meeting" value="${esc((t && t.meeting) || lastMeeting() || '')}"></label>
      </div>
      <datalist id="corpList"></datalist>
      <datalist id="secList">${sectors.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
      <div class="err" id="trErr"></div>
    </div>
    <div class="ft"><button type="button" class="btn" data-close>취소</button><button class="btn primary" value="ok">${t ? '저장' : '추가'}</button></div></form>`;
  dlg.showModal();
  fillCorp();
  let side = !t || t.qty > 0 ? 1 : -1;
  $('#sideSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; side = +b.dataset.v; [...$('#sideSeg').children].forEach(x => x.classList.toggle('on', x === b)); };
  const form = $('#trForm');
  form.name.addEventListener('change', () => {
    const n = form.name.value.trim();
    const c = corpIndex().get(n);
    if (c) form.code.value = c;
    const known = S.m.trades.slice().reverse().find(x => x.name === n);
    if (known && !form.sector.value) form.sector.value = known.sector;
  });
  form.onsubmit = async e => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    e.preventDefault();
    const f = new FormData(form);
    const trade = {
      date: f.get('date'), name: String(f.get('name')).trim(), code: String(f.get('code')).trim().toUpperCase(),
      price: +String(f.get('price')).replace(/,/g, ''), qty: side * +String(f.get('qty')).replace(/,/g, ''),
      sector: String(f.get('sector')).trim() || '미분류', reason: String(f.get('reason')).trim(),
      meeting: f.get('isMeeting') ? (f.get('meeting') || f.get('date')) : '',
    };
    try {
      if (t) await apiPost('updateTrade', { row: t.row, trade, expect: { date: t.date, name: t.name } });
      else await apiPost('addTrade', { trade });
      dlg.close();
      toast(t ? '수정했습니다.' : '추가했습니다.');
      await load(true);
    } catch (x) { $('#trErr').textContent = x.message; }
  };
}
/** 가장 최근에 쓴 회의일 (같은 회의 결정을 연달아 표시할 때 기본값) */
function lastMeeting() {
  return S.m.trades.map(t => t.meeting).filter(Boolean).sort().pop() || '';
}
function openMeeting(row) {
  const t = S.m.trades.find(x => x.row === row);
  if (!t) return;
  dlg.innerHTML = `<form method="dialog" id="meetForm">
    <div class="hd"><h3>📌 주간 회의 결정 표시</h3><button type="button" class="btn ghost sm" data-close aria-label="닫기">✕</button></div>
    <div class="bd form">
      <p style="margin:0">${esc(t.date)} · <b>${esc(t.name)}</b> ${t.qty > 0 ? '매수' : '매도'} ${qtyf(Math.abs(t.qty))}주 @ ${int(t.price)}원</p>
      <label>회의일<input class="input" type="date" name="meeting" required value="${esc(t.meeting || lastMeeting() || t.date)}"><span class="help">이 매매를 결정한 주간 회의 날짜</span></label>
      <div class="err" id="meetErr"></div>
    </div>
    <div class="ft">${t.meeting ? '<button type="button" class="btn danger" id="meetClear">표시 해제</button>' : ''}<button type="button" class="btn" data-close>취소</button><button class="btn primary" value="ok">저장</button></div></form>`;
  dlg.showModal();
  const save = async meeting => {
    try {
      await apiPost('setMeeting', { row, meeting, expect: { date: t.date, name: t.name } });
      dlg.close();
      toast(meeting ? `${meeting} 주간회의 결정으로 표시했습니다.` : '표시를 해제했습니다.');
      await load(true);
    } catch (x) { $('#meetErr').textContent = x.message; }
  };
  $('#meetForm').onsubmit = e => { e.preventDefault(); save(new FormData(e.target).get('meeting')); };
  if ($('#meetClear')) $('#meetClear').onclick = () => save('');
}
function corpIndex() {
  const m = new Map();
  (S.corp || []).forEach(c => m.set(c[0], c[1]));
  S.m.trades.forEach(t => { if (t.code && !m.has(t.name)) m.set(t.name, t.code); });
  return m;
}
function fillCorp() {
  const dl = $('#corpList');
  if (!dl) return;
  dl.innerHTML = [...corpIndex().entries()].map(([n, c]) => `<option value="${esc(n)}">${esc(c)}</option>`).join('');
}
async function delTrade(row) {
  const t = S.m.trades.find(x => x.row === row);
  if (!t || !confirm(`${t.date} ${t.name} ${t.qty > 0 ? '매수' : '매도'} ${qtyf(Math.abs(t.qty))}주 기록을 삭제할까요?`)) return;
  await run('deleteTrade', { row, expect: { date: t.date, name: t.name } }, '삭제했습니다.', true).catch(() => {});
}

/* ===================== 이벤트 ===================== */
document.addEventListener('click', e => {
  const eye = e.target.closest('[data-eye]');
  if (eye) { e.preventDefault(); toggleEye(eye); return; }
  if (e.target.closest('[data-close]')) { dlg.close(); return; }
  const link = e.target.closest('a[href^="#"]');
  if (link && link.getAttribute('href').length > 1) { e.preventDefault(); if (link.id === 'gotoMissing') S.tr.missing = true; go(link.getAttribute('href').slice(1)); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { go(tab.dataset.tab); return; }
  const hs = e.target.closest('[data-hsec]');
  if (hs) { S.hold.sector = hs.dataset.hsec; render(); return; }
  const so = e.target.closest('[data-sort]');
  if (so) { const k = so.dataset.sort; S.hold.dir = S.hold.sort === k ? -S.hold.dir : (k === 'name' || k === 'sector' ? 1 : -1); S.hold.sort = k; render(); return; }
  const rs = e.target.closest('[data-rsort]');
  if (rs) { const k = rs.dataset.rsort; S.rl.dir = S.rl.sort === k ? -S.rl.dir : (k === 'name' ? 1 : -1); S.rl.sort = k; render(); return; }
  const sd_ = e.target.closest('[data-side]');
  if (sd_) { S.tr.side = sd_.dataset.side; S.tr.limit = 60; render(); return; }
  const cl = e.target.closest('[data-clamp]');
  if (cl) { cl.classList.toggle('open'); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) { openTrade(+ed.dataset.edit); return; }
  const dl = e.target.closest('[data-del]');
  if (dl) { delTrade(+dl.dataset.del); return; }
  const mt = e.target.closest('[data-meet]');
  if (mt) { openMeeting(+mt.dataset.meet); return; }
  if (e.target.closest('[data-meetf]')) { S.tr.meeting = !S.tr.meeting; render(); return; }
  const act = e.target.closest('[data-act]');
  if (act) { adminAction(act.dataset.act, act); return; }
  const csv = e.target.closest('[data-csv]');
  if (csv) { exportCsv(csv.dataset.csv); return; }
  if (e.target.id === 'addTrade') { openTrade(null); return; }
  if (e.target.id === 'more') { S.tr.limit += 100; render(); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'trQ') {
    S.tr.q = e.target.value;
    clearTimeout(S._qt);
    S._qt = setTimeout(() => { const pos = e.target.selectionStart; render(); const q = $('#trQ'); q.focus(); q.setSelectionRange(pos, pos); }, 200);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'trSec') { S.tr.sector = e.target.value; render(); }
  if (e.target.id === 'trMiss') { S.tr.missing = e.target.checked; render(); }
});
$('#adminBtn').onclick = async () => {
  if (S.auth) { if (!isDemo()) apiPost('logout').catch(() => {}); setAuth(null); toast('로그아웃했습니다.'); }
  else openLogin(false);
};
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.m && render());

(function init() {
  try { const a = JSON.parse(store.get('vim_auth') || 'null'); if (a && a.token && ROLE_RANK[a.role]) S.auth = a; } catch (_) {}
  S.tab = validTab(location.hash.replace('#', ''));
  load();
  if (!isDemo()) setInterval(() => { if (!document.hidden && !document.querySelector('dialog[open]')) load(true); }, CONFIG.REFRESH_SEC * 1000);
})();
</script>
</body>
</html>
